<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp VIP — Ji-woo Concierge Lumina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b141a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .chat-bg {
      background-color: #0b141a;
      background-image: radial-gradient(#1f2c34 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
    .bubble-in { background-color: #202c33; border-top-left-radius: 4px; }
    .bubble-out { background-color: #005c4b; border-top-right-radius: 4px; }
  </style>
</head>
<body class="h-screen flex flex-col justify-between max-w-md mx-auto shadow-2xl border-x border-neutral-800">

  <!-- HEADER WHATSAPP -->
  <header class="bg-[#202c33] px-4 py-3 flex items-center justify-between text-white border-b border-neutral-800 z-10">
    <div class="flex items-center gap-3">
      <a href="/" class="text-neutral-400 hover:text-white"><i class="fa-solid fa-arrow-left text-lg"></i></a>
      <div class="relative">
        <img src="/assets/influencer_journey_avatar.png" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80'" class="w-10 h-10 rounded-full object-cover border border-amber-400">
        <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-[#202c33]"></span>
      </div>
      <div>
        <h1 class="font-semibold text-sm flex items-center gap-1">
          Ji-woo (Lumina VIP)
          <i class="fa-solid fa-circle-check text-emerald-400 text-xs"></i>
        </h1>
        <p class="text-xs text-emerald-400 font-medium">online agora • Dermoconsultora</p>
      </div>
    </div>
    <div class="flex gap-4 text-neutral-400 text-lg">
      <i class="fa-solid fa-phone cursor-pointer hover:text-white"></i>
      <i class="fa-solid fa-ellipsis-vertical cursor-pointer hover:text-white"></i>
    </div>
  </header>

  <!-- ÁREA DE MENSAGENS -->
  <main id="chatArea" class="flex-1 chat-bg overflow-y-auto p-4 space-y-3">
    <div class="text-center my-2">
      <span class="bg-[#182229] text-amber-200/80 text-[11px] px-3 py-1.5 rounded-lg inline-block shadow-sm">
        🔒 Canal Direto de Atendimento VIP Lumina K-Beauty
      </span>
    </div>
  </main>

  <!-- SUGESTÕES RÁPIDAS -->
  <div class="bg-[#202c33]/90 px-3 py-2 border-t border-neutral-800 flex gap-2 overflow-x-auto text-xs whitespace-nowrap text-neutral-300">
    <button onclick="quickSend('Minha principal queixa são manchas de melasma')" class="bg-[#111b21] hover:bg-neutral-700 px-3 py-1.5 rounded-full border border-neutral-700">🌸 Tenho Melasma</button>
    <button onclick="quickSend('Tenho poros dilatados e pele oleosa')" class="bg-[#111b21] hover:bg-neutral-700 px-3 py-1.5 rounded-full border border-neutral-700">✨ Poros & Oleosidade</button>
    <button onclick="quickSend('É original mesmo? Não corre risco de taxa na alfândega?')" class="bg-[#111b21] hover:bg-neutral-700 px-3 py-1.5 rounded-full border border-neutral-700">🛡️ Original? Tem taxa?</button>
    <button onclick="quickSend('Como funciona o Medicube Booster Pro?')" class="bg-[#111b21] hover:bg-neutral-700 px-3 py-1.5 rounded-full border border-neutral-700">⚡ Medicube Booster Pro</button>
  </div>

  <!-- CAMPO DE DIGITAÇÃO -->
  <footer class="bg-[#202c33] p-2 flex items-center gap-2 border-t border-neutral-800">
    <div class="flex-1 bg-[#2a3942] rounded-full flex items-center px-4 py-2 text-white">
      <input id="inputMsg" type="text" placeholder="Mensagem para a Ji-woo..." class="bg-transparent flex-1 focus:outline-none text-sm text-white placeholder-neutral-400" onkeydown="if(event.key==='Enter') sendMessage()">
    </div>
    <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 w-10 h-10 rounded-full flex items-center justify-center text-white shadow-lg">
      <i class="fa-solid fa-paper-plane text-sm"></i>
    </button>
  </footer>

  <script>
    const chatArea = document.getElementById("chatArea");
    const inputMsg = document.getElementById("inputMsg");
    
    // Histórico de memória da conversa
    const conversationHistory = [
      {
        role: "assistant",
        content: "Olá, maravilhosa! Sou a Ji-woo, dermoconsultora oficial da Lumina. ✨\n\nComo posso cuidar da sua pele hoje? Se você tiver alguma queixa (como melasma, poros abertos ou linhas de expressão), me conta por aqui que eu te oriento com todo carinho!"
      }
    ];

    function appendMessage(text, isOut = false, audioUrl = null) {
      const wrapper = document.createElement("div");
      wrapper.className = `flex ${isOut ? 'justify-end' : 'justify-start'}`;

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      
      let audioHtml = "";
      if (audioUrl) {
        audioHtml = `
          <div class="mt-2 pt-2 border-t border-white/10 flex items-center gap-2 bg-[#111b21]/80 p-2 rounded-lg">
            <audio controls class="w-full h-8" src="${audioUrl}"></audio>
          </div>
          <p class="text-[10px] text-emerald-400 mt-1 flex items-center gap-1">
            <i class="fa-solid fa-microphone"></i> Mensagem de voz da Ji-woo
          </p>
        `;
      }

      wrapper.innerHTML = `
        <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-white text-sm shadow-md leading-relaxed ${isOut ? 'bubble-out' : 'bubble-in'}">
          <p class="whitespace-pre-line">${text}</p>
          ${audioHtml}
          <div class="text-[10px] text-right mt-1 text-neutral-400 flex items-center justify-end gap-1">
            <span>${time}</span>
            ${isOut ? '<i class="fa-solid fa-check-double text-sky-400"></i>' : ''}
          </div>
        </div>
      `;
      chatArea.appendChild(wrapper);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function sendMessage(customText = null) {
      const text = customText || inputMsg.value.trim();
      if (!text) return;

      appendMessage(text, true);
      conversationHistory.push({ role: "user", content: text });
      if (!customText) inputMsg.value = "";

      // Mostra digitando...
      const typingEl = document.createElement("div");
      typingEl.id = "typingIndicator";
      typingEl.className = "flex justify-start text-xs text-neutral-400 italic px-2 py-1 items-center gap-2";
      typingEl.innerHTML = `<span class="inline-block w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span><span>Ji-woo está digitando...</span>`;
      chatArea.appendChild(typingEl);
      chatArea.scrollTop = chatArea.scrollHeight;

      try {
        const resp = await fetch("/api/whatsapp_webhook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phone: "5511999999999",
            message: text,
            history: conversationHistory
          })
        });
        const data = await resp.json();
        
        document.getElementById("typingIndicator")?.remove();

        if (data.reply) {
          appendMessage(data.reply, false, data.audioAttached);
          conversationHistory.push({ role: "assistant", content: data.reply });
        }
      } catch (err) {
        document.getElementById("typingIndicator")?.remove();
        appendMessage("Poxa, tive uma pequena oscilação na conexão. Pode me reenviar? 🌸", false);
      }
    }

    function quickSend(txt) {
      sendMessage(txt);
    }

    window.addEventListener("DOMContentLoaded", () => {
      appendMessage(conversationHistory[0].content, false);
    });
  </script>
</body>
</html>
